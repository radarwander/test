services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm?schema=public
      JWT_SECRET: super-secret-jwt
      JWT_EXPIRES_IN: 1d
      PORT: 3000
    depends_on:
      - db
    ports:
      - "3000:3000"

  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
